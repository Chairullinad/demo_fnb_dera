<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
:root{--primary:#2563eb;--primary-dark:#1e40af;--success:#16a34a;--warning:#f59e0b;--danger:#dc2626;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--sidebar:#0f172a;--gofood:#e11d48;--grabfood:#16a34a;--shopeefood:#ea580c}
body{background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e3a8a 0%,#0f172a 100%);padding:20px}
.login-box{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:480px;box-shadow:0 25px 50px rgba(0,0,0,.3)}
.login-box h1{font-size:22px;margin-bottom:6px;color:var(--primary-dark)}
.login-box p.sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.role-grid{display:grid;gap:10px;margin-bottom:20px}
.role-btn{border:2px solid var(--border);background:#fff;padding:12px 16px;border-radius:10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .15s}
.role-btn:hover{border-color:var(--primary);background:#eff6ff}
.role-btn .icon{font-size:20px}
.role-btn .label{font-weight:600;font-size:13px}
.role-btn .desc{font-size:11px;color:var(--muted)}
.role-btn.customer{border-color:#16a34a;background:#f0fdf4}
.role-btn.customer:hover{background:#dcfce7}
.btn-primary{width:100%;background:var(--primary);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.btn-primary:hover{background:var(--primary-dark)}
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:#cbd5e1;padding:20px 0;flex-shrink:0;display:flex;flex-direction:column;position:fixed;height:100vh;overflow-y:auto}
.brand{padding:0 20px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
.brand-logo{width:34px;height:34px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.brand-title{font-size:14px;font-weight:700;color:#fff}
.brand-sub{font-size:11px;color:#64748b}
.nav{padding:12px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:#cbd5e1;transition:all .15s;margin-bottom:2px;position:relative}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .ico{font-size:16px;width:20px;text-align:center}
.nav-item .badge-notif{position:absolute;right:10px;background:#dc2626;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:700}
.user-box{padding:12px 20px;border-top:1px solid #1e293b;font-size:12px;color:#94a3b8}
.user-box strong{color:#fff;display:block;font-size:13px}
.logout{color:#f87171;cursor:pointer;margin-top:6px;display:inline-block;font-size:11px}
.main{margin-left:240px;flex:1;padding:24px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.topbar h2{font-size:22px}
.outlet-picker{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border-radius:12px;padding:20px;border:1px solid var(--border)}
.stat-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat-value{font-size:24px;font-weight:700}
.stat-sub{font-size:12px;margin-top:6px}
.up{color:var(--success)}
.down{color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border)}
th{background:#f8fafc;font-weight:600;color:var(--muted);font-size:12px}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.badge-green{background:#dcfce7;color:#166534}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-purple{background:#ede9fe;color:#5b21b6}
.badge-gofood{background:#fee2e2;color:#e11d48}
.badge-grab{background:#dcfce7;color:#15803d}
.badge-shopee{background:#ffedd5;color:#c2410c}
.pos-layout{display:grid;grid-template-columns:1fr 340px;gap:16px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.menu-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;text-align:center;transition:all .15s}
.menu-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 12px rgba(37,99,235,.15)}
.menu-card .emoji{font-size:32px}
.menu-card .name{font-size:13px;font-weight:600;margin:6px 0 4px}
.menu-card .price{font-size:12px;color:var(--primary);font-weight:700}
.cart{background:#fff;border-radius:12px;padding:16px;border:1px solid var(--border);height:fit-content;position:sticky;top:24px}
.cart h3{font-size:15px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--border)}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.cart-item .qty{background:#eff6ff;color:var(--primary);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.cart-total{display:flex;justify-content:space-between;padding:14px 0;font-weight:700;font-size:16px;border-top:2px solid var(--text);margin-top:8px}
.opname-header{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;padding:20px;border-radius:12px;margin-bottom:16px}
.opname-header h3{font-size:18px;margin-bottom:4px}
.opname-header p{font-size:13px;opacity:.9}
.blind-input{background:#fef3c7;border:2px solid #f59e0b;border-radius:8px;padding:8px 12px;width:100px;font-size:14px;font-weight:700;text-align:center}
.variance-box{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;display:inline-block}
.variance-ok{background:#dcfce7;color:#166534}
.variance-warn{background:#fef3c7;color:#92400e}
.variance-bad{background:#fee2e2;color:#991b1b}
.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.kds-ticket{background:#fff;border-radius:10px;padding:14px;border-left:5px solid var(--warning);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.kds-ticket.cooking{border-left-color:var(--primary)}
.kds-ticket.ready{border-left-color:var(--success);opacity:.75}
.kds-ticket h4{font-size:14px;margin-bottom:4px}
.kds-ticket .order-id{font-size:11px;color:var(--muted)}
.kds-ticket ul{list-style:none;margin:10px 0;font-size:13px}
.kds-ticket ul li{padding:3px 0}
.kds-actions{display:flex;gap:8px;margin-top:8px}
.kds-actions button{flex:1;padding:6px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer}
.btn-cook{background:#dbeafe;color:#1e40af}
.btn-ready{background:#dcfce7;color:#166534}
.alert{background:#fef3c7;border-left:4px solid var(--warning);padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.alert-danger{background:#fee2e2;border-left-color:var(--danger)}
.alert-info{background:#dbeafe;border-left-color:var(--primary)}
.alert-success{background:#dcfce7;border-left-color:var(--success)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--primary);transition:width .4s}
#customerView{min-height:100vh;background:#f0fdf4}
.cust-header{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;padding:20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cust-header h1{font-size:18px}
.cust-header p{font-size:12px;opacity:.9}
.cust-content{padding:16px;max-width:900px;margin:0 auto}
.table-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
.table-btn{background:#fff;border:2px solid var(--border);border-radius:10px;padding:18px 12px;cursor:pointer;text-align:center;transition:all .15s}
.table-btn:hover{border-color:var(--success);background:#f0fdf4}
.table-btn .num{font-size:24px;font-weight:700;color:var(--text)}
.table-btn .cap{font-size:11px;color:var(--muted);margin-top:4px}
.table-btn.occupied{border-color:var(--warning);background:#fffbeb}
.table-btn.occupied .num{color:var(--warning)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}
.form-label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.form-input{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;width:100%}
.platform-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .15s}
.platform-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.platform-logo{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700;margin-bottom:10px}
.platform-gofood{background:linear-gradient(135deg,#e11d48,#be123c)}
.platform-grab{background:linear-gradient(135deg,#16a34a,#15803d)}
.platform-shopee{background:linear-gradient(135deg,#ea580c,#c2410c)}
.delivery-order{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
.delivery-order.new{border-left:5px solid var(--warning);background:#fffbeb}
.delivery-order.accepted{border-left:5px solid var(--primary);background:#eff6ff}
.delivery-order.ready{border-left:5px solid var(--success);background:#f0fdf4}
.delivery-order.picked{border-left:5px solid var(--muted);background:#f8fafc;opacity:.7}
.settings-box{background:#f8fafc;border:1px dashed var(--border);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px}
.settings-box code{background:#1e293b;color:#4ade80;padding:2px 6px;border-radius:4px;font-family:Consolas,monospace;font-size:11px}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3,.grid-2{grid-template-columns:1fr}.pos-layout{grid-template-columns:1fr}}
@media(max-width:700px){.sidebar{width:60px}.brand-title,.brand-sub,.nav-item span:not(.ico):not(.badge-notif),.user-box{display:none}.nav-item{justify-content:center;padding:12px 0}.main{margin-left:60px;padding:14px}.grid-4{grid-template-columns:1fr}}

</head>

function login(role){
  state.role=role;

  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent = role==='owner'?'Budi Santoso':role==='kasir'?'Siti Aminah':'Andi Pratama';
  document.getElementById('userRole').textContent = role==='owner'?'Owner':role==='kasir'?'Kasir — Outlet A':'Staff Gudang — Outlet A';

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV[state.role].map(item=>{
    let count = 0;
    if(item.id==='delivery') count = state.deliveryOrders.filter(o=>o.status==='new').length;
    if(item.id==='onlineorders') count = state.onlineOrders.filter(o=>o.status==='pending_payment').length;
    const badge = item.badge && count>0 ? `<span class="badge-notif">${count}</span>` : '';
    return `<div class="nav-item ${state.page===item.id?'active':''}" onclick="goTo('${item.id}')">

}

function simulateDelivery(platform){
  const menus = state.menu.slice(0,4);
  const numItems = 1 + Math.floor(Math.random()*3);
  const items = [];
  let total = 0;
  for(let i=0;i<numItems;i++){
    const m = menus[Math.floor(Math.random()*menus.length)];
    const qty = 1 + Math.floor(Math.random()*3);
    const harga = Math.round(m.harga * 1.15); // mark-up aggregator
    items.push({nama:m.nama, qty:qty, harga:harga});
    total += harga*qty;
  }
  const commission = Math.round(total * state.deliverySettings[platform].commission / 100);
  const net = total - commission;
  const idPrefix = platform==='gofood'?'GF':platform==='grabfood'?'GB':'SF';
  const id = `${idPrefix}-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${String(state.deliveryOrders.length+1).padStart(3,'0')}`;
  const names = ['Budi S.','Siti A.','Dedi K.','Rina M.','Ahmad F.','Lina W.'];
  const areas = ['Jl. Sudirman No. ','Jl. Kemang Raya ','Apartemen BSD Tower ','Jl. TB Simatupang ','Jl. Gatot Subroto '];
  state.deliveryOrders.unshift({
    id:id, platform:platform,
    customer:names[Math.floor(Math.random()*names.length)],
    alamat:areas[Math.floor(Math.random()*areas.length)] + (1+Math.floor(Math.random()*100)),
    items:items, total:total, commission:commission, net:net,
    status:'new', waktu:'baru saja', driver:null,
  });
  renderNav(); render();
}

function acceptDelivery(id){
  const o = state.deliveryOrders.find(x=>x.id===id);
  if(!o) return;
  o.status = 'accepted';
  // Auto-deduct stok
  let detail = '';
  o.items.forEach(item=>{
    const menu = state.menu.find(m=>m.nama===item.nama);
    if(menu && menu.resep){
      menu.resep.forEach(r=>{
        const bahan = state.stock.find(s=>s.id===r.id);
        if(bahan){
          const terpakai = r.qty * item.qty;
          bahan.stok = Math.max(0, +(bahan.stok - terpakai).toFixed(2));
          state.outletStocks.A[bahan.id] = Math.max(0, +(state.outletStocks.A[bahan.id] - terpakai).toFixed(2));
          detail += `• ${bahan.nama}: -${terpakai} ${bahan.satuan}\n`;
        }
      });
    }
  });
  // Add to KDS
  state.kds.unshift({
    id:o.id, meja:`🛵 ${platformInfo[o.platform].nama} - ${o.customer}`,
    items:o.items.map(i=>`${i.qty}× ${i.nama}`),
    status:'new', waktu:'baru saja', platform:o.platform,
  });
  alert(`✅ Order ${o.id} diterima!\n\n🍳 Order dikirim ke KDS\n🔄 Stok auto-deduct:\n${detail || '(menu tanpa resep)'}`);
  renderNav(); render();
}

function rejectDelivery(id){
  if(!confirm('Tolak order '+id+'?')) return;
  state.deliveryOrders = state.deliveryOrders.filter(x=>x.id!==id);
  alert('❌ Order ditolak.');
  renderNav(); render();
}

function pickupDelivery(id){
  const o = state.deliveryOrders.find(x=>x.id===id);
  if(!o) return;
  o.status = 'picked';
  o.driver = o.driver || 'Driver-' + Math.floor(Math.random()*999);
  // Journal entries
  state.journals.unshift({
    id:'JV-'+String(state.journals.length+1).padStart(3,'0'),
    tgl:new Date().toISOString().slice(0,10),
    ket:`Penerimaan Bersih ${platformInfo[o.platform].nama} (${o.id})`,
    debit:'Kas '+platformInfo[o.platform].nama, kredit:'Pendapatan', jumlah:o.net,
  });
  state.journals.unshift({
    id:'JV-'+String(state.journals.length+1).padStart(3,'0'),

    debit:'Beban Komisi', kredit:'Kas '+platformInfo[o.platform].nama, jumlah:o.commission,

  renderNav(); render();
}

function addCart(id){
  const m = state.menu.find(x=>x.id===id);
  const e = state.cart.find(i=>i.id===id);
  if(e) e.qty++;else state.cart.push({...m,qty:1});
  render();
}
function removeCart(idx){
  if(state.cart[idx].qty>1) state.cart[idx].qty--;
  else state.cart.splice(idx,1);
  render();
}
function checkout(){
  if(state.cart.length===0){alert('Keranjang kosong!');return}
  let detail = '';
  state.cart.forEach(item=>{
    item.resep.forEach(r=>{
      const b = state.stock.find(s=>s.id===r.id);
      if(b){const t = r.qty*item.qty;b.stok = Math.max(0,+(b.stok-t).toFixed(2));
        state.outletStocks.A[b.id] = Math.max(0,+(state.outletStocks.A[b.id]-t).toFixed(2));
        detail += `• ${b.nama}: -${t} ${b.satuan}\n`}
    });
  });
  const sub = state.cart.reduce((s,i)=>s+i.harga*i.qty,0);
  const g = Math.round(sub*1.1);
  state.journals.unshift({id:'JV-'+String(state.journals.length+1).padStart(3,'0'),
    tgl:new Date().toISOString().slice(0,10),ket:'Penjualan POS (Kasir)',
    debit:'Kas',kredit:'Pendapatan',jumlah:g});
  alert(`✅ TRANSAKSI BERHASIL\n\nTotal: ${rupiah(g)}\n\n🔄 STOK BERKURANG:\n${detail||'(tanpa resep)'}\n\n📤 Ke KDS\n📊 Jurnal: Kas/ Pendapatan ${rupiah(g)}`);
  state.cart = [];render();
}

function payOnline(id){

    status:'new', waktu:'baru saja', platform:null});
  state.journals.unshift({id:'JV-'+String(state.journals.length+1).padStart(3,'0'),
    tgl:new Date().toISOString().slice(0,10),ket:`Penjualan Online (${id} - Meja ${o.meja})`,
    debit:'Kas',kredit:'Pendapatan',jumlah:o.total});

function cancelOnline(id){

function createTransfer(){
  const dari = document.getElementById('trfDari').value;
  const ke = document.getElementById('trfKe').value;
  const itemId = parseInt(document.getElementById('trfItem').value);
  const qty = parseFloat(document.getElementById('trfQty').value);
  const catatan = document.getElementById('trfCatatan').value.trim();
  if(dari===ke){alert('Outlet asal dan tujuan tidak boleh sama!');return}
  if(!qty||qty<=0){alert('Qty harus > 0!');return}
  const item = state.stock.find(s=>s.id===itemId);
  const stokAsal = state.outletStocks[dari][itemId]??0;
  if(qty>stokAsal){alert(`❌ Stok Outlet ${dari} tidak cukup!\n\nTersedia: ${stokAsal} ${item.satuan}\nDiminta: ${qty} ${item.satuan}`);return}
  const id = 'TRF-'+String(state.transfers.length+1).padStart(3,'0');
  state.transfers.unshift({id:id,dari:dari,ke:ke,
    items:[{itemId:itemId,nama:item.nama,qty:qty,satuan:item.satuan}],
    status:'pending',tanggal:new Date().toISOString().slice(0,10),
    pengirim:state.role==='gudang'?'Andi':state.role==='kasir'?'Siti':'Owner',
    penerima:null,catatan:catatan||'—'});
  alert(`✅ Transfer ${id} dibuat!\n\n📍 ${dari} → ${ke}\n📦 ${item.nama} ${qty} ${item.satuan}\n\n⏳ Menunggu approval.`);
  render();
}
function approveTransfer(id){
  const t = state.transfers.find(x=>x.id===id);
  if(!t) return;
  for(const i of t.items){
    const s = state.outletStocks[t.dari][i.itemId]??0;
    if(i.qty>s){alert(`❌ Stok Outlet ${t.dari} tidak cukup untuk ${i.nama}!`);return}
  }
  t.items.forEach(i=>{state.outletStocks[t.dari][i.itemId] -= i.qty});
  t.status = 'in_transit';
  const total = t.items.reduce((s,i)=>{
    const st = state.stock.find(x=>x.id===i.itemId);
    return s + (st?st.harga*i.qty:0);
  },0);
  state.journals.unshift({id:'JV-'+String(state.journals.length+1).padStart(3,'0'),
    tgl:new Date().toISOString().slice(0,10),
    ket:`Transfer ${t.id} (${t.dari} → ${t.ke}) - In Transit`,
    debit:'Persediaan In-Transit', kredit:`Persediaan Outlet ${t.dari}`, jumlah:total});
  alert(`✅ Transfer ${t.id} di-approve!\n\n📤 In-Transit\n📦 Stok Outlet ${t.dari} berkurang\n📊 Jurnal otomatis`);
  renderNav();render();
}
function receiveTransfer(id){
  const t = state.transfers.find(x=>x.id===id);
  if(!t) return;
  t.items.forEach(i=>{
    state.outletStocks[t.ke][i.itemId] = (state.outletStocks[t.ke][i.itemId]??0) + i.qty;
  });
  t.status = 'received';
  t.penerima = state.role==='gudang'?'Andi':state.role==='kasir'?'Siti':'Owner';
  const total = t.items.reduce((s,i)=>{
    const st = state.stock.find(x=>x.id===i.itemId);
    return s + (st?st.harga*i.qty:0);
  },0);
  state.journals.unshift({id:'JV-'+String(state.journals.length+1).padStart(3,'0'),
    tgl:new Date().toISOString().slice(0,10),
    ket:`Penerimaan ${t.id} (${t.dari} → ${t.ke})`,
    debit:`Persediaan Outlet ${t.ke}`, kredit:'Persediaan In-Transit', jumlah:total});
  alert(`✅ Transfer ${t.id} DITERIMA!\n\n📥 Stok Outlet ${t.ke} bertambah\n📊 Jurnal otomatis`);
  renderNav();render();
}
function cancelTransfer(id){
  if(!confirm('Tolak transfer '+id+'?'))return;
  const t = state.transfers.find(x=>x.id===id);
  if(t) t.status = 'cancelled';
  render();
}

      </table></div>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div style="font-size:13px;color:var(--muted);">📸 Upload foto & TTD digital sebelum submit.</div>
      <div><button class="btn-primary" style="width:auto;padding:10px 24px;background:#94a3b8;" onclick="alert('Draft tersimpan')">💾 Simpan Draft</button>
        <button class="btn-primary" style="width:auto;padding:10px 24px;margin-left:8px;" onclick="submitOpname()">✅ Submit</button></div>
    </div>`;
}
function setFisik(id,val){
  const item = state.opname.find(o=>o.id===id);
  item.fisik = val===''?null:parseFloat(val);
  render();
}
function submitOpname(){
  const belum = state.opname.filter(o=>o.fisik===null);
  if(belum.length>0){alert(`Masih ada ${belum.length} item belum dihitung!`);return}
  const variances = state.opname.map(o=>({...o,selisih:+(o.fisik-o.sistem).toFixed(2)}))
    .filter(o=>Math.abs(o.selisih)>=.5);
  let msg = '✅ OPNAME DI-SUBMIT\n\nTotal item: '+state.opname.length+'\nSelisih: '+variances.length+'\n\n';
  if(variances.length>0){
    msg += '📋 DETAIL SELISIH:\n';
    let totalNilai = 0;
    variances.forEach(v=>{
      const b = state.stock.find(s=>s.nama===v.nama);
      const n = Math.abs(v.selisih*(b?.harga||0));
      totalNilai += n;
      msg += `• ${v.nama}: ${v.selisih>0?'+':''}${v.selisih} ${v.satuan} (${rupiah(n)})\n`;
    });
    msg += `\n💰 Total: ${rupiah(totalNilai)}\n📊 Jurnal otomatis\n⚠️ Alert ke Owner jika >2%`;
  } else { msg += '🎉 Semua sesuai!' }
  alert(msg);
}

   ============================================================ */
function pageKDS(){

    <div class="grid grid-3" style="margin-bottom:16px;">
      <div class="card"><div class="stat-label">Antrian Baru</div>
        <div class="stat-value" style="color:var(--warning);">${state.kds.filter(k=>k.status==='new').length}</div></div>
      <div class="card"><div class="stat-label">Sedang Dimasak</div>
        <div class="stat-value" style="color:var(--primary);">${state.kds.filter(k=>k.status==='cooking').length}</div></div>
      <div class="card"><div class="stat-label">Siap Disajikan</div>
        <div class="stat-value" style="color:var(--success);">${state.kds.filter(k=>k.status==='ready').length}</div></div></div>
    <div class="kds-grid">
      ${state.kds.map(k=>{
        const platBadge = k.platform ? `<span class="badge badge-${platformInfo[k.platform].cls}" style="margin-left:6px;">${platformInfo[k.platform].logo}</span>` : '';
        return `<div class="kds-ticket ${k.status}">
          <div style="display:flex;justify-content:space-between;align-items:start;">
            <div><h4>${k.meja} ${platBadge}</h4><div class="order-id">${k.id} • ${k.waktu}</div></div>
            <span class="badge ${k.status==='new'?'badge-yellow':k.status==='cooking'?'badge-blue':'badge-green'}">
              ${k.status==='new'?'Baru':k.status==='cooking'?'Dimasak':'Siap'}</span></div>
          <ul>${k.items.map(i=>`<li>${i}</li>`).join('')}</ul>
          <div class="kds-actions">
            ${k.status==='new'?`<button class="btn-cook" onclick="setKds('${k.id}','cooking')">🍳 Mulai Masak</button>`:''}
            ${k.status==='cooking'?`<button class="btn-ready" onclick="setKds('${k.id}','ready')">✅ Siap Saji</button>`:''}
            ${k.status==='ready'?`<button class="btn-ready" onclick="setKds('${k.id}','done')">📤 Sudah Diambil</button>`:''}
          </div></div>`;
      }).join('')}
    </div>`;
}
function setKds(id,status){
  const item = state.kds.find(k=>k.id===id);
  if(status==='done') state.kds = state.kds.filter(k=>k.id!==id);
  else item.status = status;
  render();
}

    {tgl:'2025-10-19',bahan:'Daging Sapi',qty:'0.3 kg',alasan:'Expired',nilai:39000,oleh:'Siti'},

    <div class="grid grid-3" style="margin-bottom:16px;">

        <div class="stat-value" style="color:var(--danger);">${rupiah(t)}</div></div>
      <div class="card"><div class="stat-label">% dari Penjualan</div><div class="stat-value">1.8%</div></div>
      <div class="card"><div class="stat-label">Paling Sering</div>
        <div class="stat-value" style="font-size:16px;">Sayur & Dairy</div></div></div>
    <div class="card" style="margin-bottom:16px;"><h3 style="font-size:15px;margin-bottom:14px;">Catat Waste Baru</h3>

        <select class="outlet-picker"><option>Sayur Sawi</option><option>Daging Sapi</option></select>

        <button class="btn-primary" style="width:auto;padding:8px 20px;" onclick="alert('✅ Tercatat.\\n📦 Stok berkurang\\n📊 Jurnal: Beban Waste (D) / Persediaan (K)')">+ Catat</button>
      </div></div>
    <div class="card"><h3 style="font-size:15px;margin-bottom:14px;">Riwayat Waste</h3>

        ${w.map(x=>`<tr><td>${x.tgl}</td><td><strong>${x.bahan}</strong></td><td>${x.qty}</td>

}

/* ============================================================
   CUSTOMER VIEW
   ============================================================ */
function renderCustomer(){
  const el = document.getElementById('custContent');
  if(!state.custTable){
    document.getElementById('custTableInfo').textContent = 'Pilih meja Anda';
    el.innerHTML = `<div class="card" style="margin-bottom:16px;">
      <h3 style="font-size:15px;margin-bottom:6px;">🪑 Pilih Meja</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">Scan QR di meja → atau pilih manual</p>
      <div class="table-map">${state.tables.map(t=>`
        <div class="table-btn ${t.status==='occupied'?'occupied':''}" onclick="pilihMeja(${t.num})">
          <div class="num">${t.num}</div><div class="cap">${t.cap} org · ${t.status}</div></div>`).join('')}</div></div>
      <div class="alert alert-info" style="margin-bottom:0;">💡 <strong>Cara pesan:</strong> Pilih meja → pilih menu → submit → bayar di kasir.</div>`;
    return;
  }
  if(state.custSubmitted){
    const total = state.custCart.reduce((s,i)=>s+i.harga*i.qty,0);
    document.getElementById('custTableInfo').textContent = 'Meja ' + state.custTable;
    el.innerHTML = `<div class="card" style="text-align:center;padding:40px 20px;">
      <div style="font-size:64px;margin-bottom:16px;">✅</div>
      <h2 style="font-size:20px;margin-bottom:8px;">Pesanan Terkirim!</h2>
      <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Pesanan sudah masuk ke kasir & dapur</p>
      <div style="background:#f0fdf4;border-radius:12px;padding:20px;margin-bottom:20px;text-align:left;">
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">🪑 Meja</div>
        <div style="font-size:18px;font-weight:700;margin-bottom:14px;">Meja ${state.custTable}</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">🍽️ Pesanan</div>
        ${state.custCart.map(i=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;">
          <span>${i.qty}× ${i.nama}</span><span>${rupiah(i.harga*i.qty)}</span></div>`).join('')}
        <div style="border-top:2px solid var(--text);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;">
          <strong>Total</strong><strong style="color:var(--success);font-size:18px;">${rupiah(total)}</strong></div></div>
      <div class="alert alert-info" style="text-align:left;margin-bottom:20px;">
        💳 <strong>Silakan bayar di kasir.</strong><br>
        <span style="font-size:12px;">Tunjukkan meja ${state.custTable} ke kasir.</span></div>
      <button class="btn-primary" style="background:#16a34a;" onclick="resetCustomer()">🔄 Pesan Lagi</button></div>`;
    return;
  }
  document.getElementById('custTableInfo').textContent = 'Meja ' + state.custTable;
  const sub = state.custCart.reduce((s,i)=>s+i.harga*i.qty,0);
  el.innerHTML = `<div class="grid grid-2" style="gap:16px;">
    <div><h3 style="font-size:15px;margin-bottom:12px;">📖 Pilih Menu</h3>
      <div class="menu-grid">${state.menu.map(m=>`
        <div class="menu-card" onclick="addCustCart(${m.id})">
          <div class="emoji">${m.emoji}</div><div class="name">${m.nama}</div>
          <div class="price">${rupiah(m.harga)}</div></div>`).join('')}</div></div>
    <div class="cart"><h3>🛒 Pesanan Anda</h3>
      ${state.custCart.length===0?'<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px 0;">Belum ada item</p>':
        state.custCart.map((i,idx)=>`<div class="cart-item">
          <div><div style="font-weight:600;">${i.nama}</div>
            <div style="font-size:11px;color:var(--muted);">${rupiah(i.harga)} × ${i.qty}</div></div>
          <div style="text-align:right;"><div style="font-weight:700;">${rupiah(i.harga*i.qty)}</div>
            <span class="qty" onclick="removeCustCart(${idx})" style="cursor:pointer;">−</span></div></div>`).join('')}
      <div class="cart-total"><span>Total</span><span style="color:var(--success);">${rupiah(sub)}</span></div>
      <button class="btn-primary" style="margin-top:12px;background:#16a34a;" onclick="submitCustOrder()">📤 Kirim ke Kasir</button>
      <button class="btn-primary" style="margin-top:8px;background:#94a3b8;" onclick="resetCustomer()">🔄 Ganti Meja</button>
      <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:8px;">💳 Bayar di kasir setelah submit</p>
    </div></div>`;
}
function pilihMeja(n){state.custTable=n;state.custCart=[];state.custSubmitted=false;renderCustomer()}
function addCustCart(id){
  const m = state.menu.find(x=>x.id===id);
  const e = state.custCart.find(i=>i.id===id);
  if(e) e.qty++; else state.custCart.push({...m,qty:1});
  renderCustomer();
}
function removeCustCart(idx){
  if(state.custCart[idx].qty>1) state.custCart[idx].qty--;
  else state.custCart.splice(idx,1);
  renderCustomer();
}
function submitCustOrder(){
  if(state.custCart.length===0){alert('Pilih menu dulu!');return}
  const total = state.custCart.reduce((s,i)=>s+i.harga*i.qty,0);
  state.onlineOrders.unshift({
    id:'ONL-'+String(state.onlineOrders.length+1).padStart(3,'0'),
    meja:state.custTable,
    items:state.custCart.map(i=>({nama:i.nama,qty:i.qty,harga:i.harga})),
    total:total,status:'pending_payment',waktu:'baru saja',
  });
  const t = state.tables.find(x=>x.num===state.custTable);
  if(t) t.status = 'occupied';
  state.custSubmitted = true;
  renderCustomer();
}
function resetCustomer(){state.custTable=null;state.custCart=[];state.custSubmitted=false;renderCustomer()}
</script>
